[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo"
version = "0.1.0"
description = "Kairo: a persistent autonomous runtime in which cognition operates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kairo = "kairo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kairo.dashboard" = ["static/*"]
